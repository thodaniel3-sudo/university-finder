{% extends "base.html" %}

{% block title %}Too many requests — University Finder{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div style="font-size: 6rem; line-height: 1;" class="text-warning">
        <i class="bi bi-hourglass-split"></i>
    </div>
    <h1 class="fw-bold mt-4">Too many requests</h1>
    <p class="text-muted mb-4">
        You've made too many requests in a short time. Please wait a moment
        and try again.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i>Back to home
    </a>
</div>
{% endblock %}
